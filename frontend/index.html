<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navjot's Portfolio Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
      <div class="header-content">
        <h1>🤖 Portfolio Assistant</h1>
        <p>Ask me anything about Navjot's skills, projects, and experience</p>
      </div>
    </div>

    <!-- Messages Container -->
    <div class="chat-messages" id="chatMessages">
      <div class="message bot-message">
        <p>
          👋 Hi! I'm Navjot's assistant. Ask me about her skills, projects,
          experience, or how to get in touch!
        </p>
      </div>
    </div>

    <!-- Input Area -->
    <div class="chat-input-area">
      <form id="chatForm">
        <input
          type="text"
          id="messageInput"
          placeholder="Ask me something..."
          autocomplete="off"
        />
        <button type="submit" id="sendBtn">
          <span>Send</span>
          <span class="send-icon">➜</span>
        </button>
      </form>
    </div>
  </div>

  <script src="chat.js"></script>
</body>
</html>
